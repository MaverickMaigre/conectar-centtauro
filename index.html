<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciando Centtauro City RP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fundo com degradê azul escuro para integrar perfeitamente com o banner */
            background: linear-gradient(135deg, #050b14 0%, #0b1420 50%, #050b14 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }
        /* Banner responsivo que se adapta a qualquer largura de monitor sem sumir */
        .banner-container {
            width: 100%;
            max-width: 800px; /* Largura máxima ideal para não estourar em monitores gigantes */
            margin-bottom: -20px; /* Aproxima o banner do card central */
            z-index: 2;
            display: flex;
            justify-content: center;
        }
        .banner-img {
            width: 100%;
            height: auto;
            max-height: 200px; /* Evita que o banner fique gigante verticalmente */
            object-fit: contain; /* Garante que a imagem inteira apareça sempre */
            border-radius: 10px 10px 0 0;
            filter: drop-shadow(0px 5px 15px rgba(0, 150, 255, 0.3)); /* Sombra neon azul abaixo do banner */
        }
        /* Card central do Loading */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(11, 22, 37, 0.95); /* Um pouco mais opaco para dar destaque */
            padding: 40px;
            border-radius: 0 0 15px 15px; /* Arredonda apenas a parte de baixo para encaixar no banner */
            text-align: center;
            box-shadow: 0 10px 32px 0 rgba(0, 110, 255, 0.15);
            border: 1px solid rgba(0, 150, 255, 0.2);
            border-top: none; /* Remove a borda superior para colar no banner */
            max-width: 450px;
            width: 100%;
        }
        /* Logo oficial centralizada */
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.4);
            border: 2px solid rgba(0, 150, 255, 0.3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        p {
            color: #9cb3cc;
            font-size: 15px;
            margin-bottom: 25px;
        }
        /* Spinner de carregamento em azul */
        .spinner {
            border: 4px solid rgba(0, 150, 255, 0.1);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border-left-color: #0096ff;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Botão de conexão manual */
        .btn-manual {
            display: inline-block;
            background-color: #0084ff;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 132, 255, 0.3);
        }
        .btn-manual:hover {
            background-color: #0066cc;
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(0, 132, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <img class="banner-img" src="banner.gif" alt="Centtauro Banner">
    </div>

    <div class="container">
        <img class="logo" src="logo.gif" alt="Centtauro City">
        
        <h1>Centtauro City</h1>
        <p>Iniciando carregamento dos módulos...</p>
        
        <div class="spinner"></div>
        
        <p style="font-size: 12px; color: #627d99; margin-bottom: 15px;">Se o seu FiveM não iniciar a conexão automaticamente, utilize o botão abaixo:</p>
        <a href="fivem://connect/cfx.re/join/kr9bar" class="btn-manual">Conectar Manualmente</a>
    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "fivem://connect/cfx.re/join/kr9bar";
            }, 1800);
        };
    </script>
</body>
</html>
