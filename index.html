<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciando Centtauro City RP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #152232; /* Cor correspondente ao seu EmbedColor */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* Banner de fundo borrado */
        .background-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://media.discordapp.net/attachments/1177148397719933050/1178168716425429052/Loading_Centauro.gif');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.3);
            z-index: 1;
        }
        /* Card central contendo as informações */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(20, 20, 20, 0.85);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
            width: 90%;
        }
        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            color: #b9bbbe;
            font-size: 16px;
            margin-bottom: 25px;
        }
        /* Animação de Loading (Spinner) */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border-left-color: #00ff77;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-manual {
            display: inline-block;
            background-color: #00ff77;
            color: #111;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s ease;
        }
        .btn-manual:hover {
            background-color: #00cc5f;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="background-banner"></div>

    <div class="container">
        <img class="logo" src="https://media.discordapp.net/attachments/1177148397719933050/1486866090557706372/centtaurocity.gif" alt="Centtauro City">
        
        <h1>Centtauro City RP</h1>
        <p>Iniciando conexão com a cidade...</p>
        
        <div class="spinner"></div>
        
        <p style="font-size: 13px; color: #888; margin-bottom: 15px;">Se o seu FiveM não abrir automaticamente em instantes, clique no botão abaixo:</p>
        <a href="fivem://connect/cfx.re/join/kr9bar" class="btn-manual">Abrir FiveM Manualmente</a>
    </div>

    <script>
        // Executa o redirecionamento automático assim que a página carrega
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "fivem://connect/cfx.re/join/kr9bar";
            }, 1500); // Aguarda 1.5 segundos para o usuário ver o loading e depois abre o FiveM
        };
    </script>
</body>
</html>
